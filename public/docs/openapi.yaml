openapi: 3.1.0

info:
  title: PulseChat API
  version: 1.0.0
  description: |
    Reverse-engineered specification for the chat service used by this project.

    The Swagger URL supplied with the assignment serves an unmodified default
    Swagger UI still pointing at `petstore.swagger.io`, and no machine-readable
    spec is published at `/swagger.json`, `/openapi.json` or `/docs/json`. This
    document was therefore written from observed request/response pairs against
    the live service on 22 Aug 2026.

    It describes the API **as it actually behaves**, including the quirks —
    `_id` keys, mixed response envelopes, the singular `participant` field on
    direct threads, and the undocumented three-member minimum for groups. Those
    are recorded here rather than idealised away, because a client has to handle
    what the server really sends.

servers:
  - url: https://frontend-task-chatapp.onrender.com/api
    description: Hosted demo (free Render instance; cold starts take up to ~60s)

tags:
  - name: Authentication
  - name: Users
  - name: Conversations
  - name: Messages

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in, registering the phone number if it is new
      description: |
        There is no separate registration route. An unrecognised phone number
        creates an account; a known one signs in. `name` is applied on both paths.

        Phone numbers are stored verbatim with no E.164 normalisation, so
        `+15551234567` and `15551234567` are two distinct accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name]
              properties:
                phone:
                  type: string
                  example: '+15551234567'
                name:
                  type: string
                  example: Ada Lovelace
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: JWT (HS256); `sub` is the user's `_id`. Valid for 7 days.
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user
      description: Returns the user object directly — it is **not** wrapped in `{ user }`.
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoToken'

  /users/search:
    get:
      tags: [Users]
      summary: Search the directory by name or phone
      description: |
        Returns a **bare array**, unpaginated, and includes the caller — filter
        yourself out client-side.

        Matching is not a substring search: `name` is matched by an **anchored
        regular expression** and `phone` by **exact equality**. `anikur` finds
        that user; `nikur` does not. `01750885871` finds that user; `0175088`
        does not.

        **The query is interpolated into a MongoDB regex unescaped**, so `+`,
        `*`, `?`, `(`, `)` or `[` return `500`
        (`"Regular expression is invalid"`, code 51091). Since `+` begins most
        international numbers, an unescaped search box will crash this endpoint.
        It is also a regex-injection / ReDoS surface.

        Escaping the query client-side fixes the crash but, because `phone` is
        compared by equality, means a number stored with a leading `+` cannot be
        matched by number at all. Such users remain findable by name.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          example: ada
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoToken'

  /conversations:
    get:
      tags: [Conversations]
      summary: List the caller's conversations
      description: |
        Wrapped in `{ data: [...] }` and ordered by `updatedAt` descending.

        Note the shape is not uniform across `type`: a `direct` thread carries a
        singular `participant` object, while a `group` carries a `participants`
        array plus `admins`.
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/NoToken'

    post:
      tags: [Conversations]
      summary: Start (or return) a direct conversation
      description: |
        Idempotent — an existing thread with the same counterpart is returned
        rather than duplicated.

        The response shape differs from the list endpoint: `participants` is an
        array of **id strings**, there is no `type`, and the counterpart's name
        is absent. Refetch the list to resolve the thread title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, example: 6a889c46e5d6aac9752426e0 }
      responses:
        '200':
          description: The direct conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDirectConversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/group:
    post:
      tags: [Conversations]
      summary: Create a group conversation
      description: |
        **Undocumented constraint:** a group requires at least three members, so
        `participantIds` must contain two or more ids besides the caller. Fewer
        returns `VALIDATION_ERROR` with
        `details[0].message = "a group needs at least 3 members"`.

        The caller is added to both `participants` and `admins` automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, participantIds]
              properties:
                name: { type: string, example: Core Engineering }
                participantIds:
                  type: array
                  minItems: 2
                  items: { type: string }
      responses:
        '201':
          description: The created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      tags: [Conversations]
      summary: Rename a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/UpdatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      summary: Add members to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/UpdatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/{id}/participants/{userId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: userId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Conversations]
      summary: Remove a member from a group
      description: Passing your own id is how you leave a group.
      responses:
        '200':
          $ref: '#/components/responses/UpdatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/{id}/admins:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      summary: Promote a member to admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/UpdatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'

  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: Read conversation history
      description: |
        Messages are returned **newest-first**; sort ascending on `createdAt`
        to render a transcript.

        `hasMore` is returned but no cursor parameter is honoured — only
        `limit` — so paging back through a long history is not possible.

        A malformed conversation id yields `500 SERVER_ERROR`
        (`Cast to ObjectId failed`) rather than `400`.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1 }
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  hasMore: { type: boolean }
        '400':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/ServerError'

  /messages:
    post:
      tags: [Messages]
      summary: Send a message
      description: |
        Returns `200` where `201` would be conventional.

        **An empty or whitespace-only `text` is accepted and stored** — only
        omitting the field entirely is rejected. Preventing blank messages is
        therefore a client-side responsibility.

        `clientTempId` is accepted but **not echoed back** in the response —
        reattach it client-side to reconcile an optimistic message.

        A successful write is what triggers the `message:new` broadcast to the
        other participants; there is no outbound socket equivalent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, text]
              properties:
                conversationId: { type: string }
                text:
                  type: string
                  description: |
                    Not validated for emptiness server-side; `""` is stored.
                  example: See you then
                clientTempId:
                  type: string
                  description: Client correlation id. Accepted, not returned.
      responses:
        '200':
          description: The persisted message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. Note that a **missing** token returns
        `400 NO_TOKEN`, not `401`.

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: 6a88a592e5d6aac97524752d

  responses:
    UpdatedConversation:
      description: The full updated conversation, so clients can patch state without refetching
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conversation'
    NoToken:
      description: Authorization header missing (`NO_TOKEN`) — note the 400 status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request body failed validation (`VALIDATION_ERROR`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unhandled server fault (`SERVER_ERROR`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId. Note the underscore — there is no `id` field.
          example: 6a883deee5d6aac975220b6a
        name: { type: string, example: Ada Lovelace }
        phone: { type: string, example: '+15551234567' }
        createdAt: { type: string, format: date-time }
      required: [_id, name, phone]

    Conversation:
      type: object
      properties:
        _id: { type: string }
        type:
          type: string
          enum: [direct, group]
        name:
          type: [string, 'null']
          description: Groups only.
        participant:
          $ref: '#/components/schemas/User'
          description: |
            **Direct threads only** — the counterpart, as a single object.
            Groups use the plural `participants` array instead.
        participants:
          type: array
          description: '**Group threads only.**'
          items:
            $ref: '#/components/schemas/User'
        admins:
          type: array
          description: Admin user ids (bare strings, unlike `participants`).
          items: { type: string }
        createdBy: { type: string }
        lastMessage:
          type: object
          description: |
            An **empty object** `{}` rather than `null` when the thread has no
            messages — truthy, so check `Object.keys().length` before reading it.
          properties:
            text: { type: string }
            sender: { type: string, description: User id. }
            createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [_id, updatedAt]

    CreatedDirectConversation:
      type: object
      description: |
        Shape returned by `POST /conversations` — narrower than the list shape.
      properties:
        _id: { type: string }
        participants:
          type: array
          description: Bare user **id strings**, not objects.
          items: { type: string }
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        _id: { type: string }
        conversation:
          type: string
          description: Conversation id. Note the field is `conversation`, not `conversationId`.
        sender:
          type: string
          description: Sender's user id as a bare string, not an embedded object.
        text: { type: string }
        createdAt: { type: string, format: date-time }
      required: [_id, conversation, sender, text, createdAt]

    SocketMessageNew:
      type: object
      description: |
        Payload of the `message:new` Socket.IO event. **This is not the REST
        `Message` shape**: the key is `id` rather than `_id`, and `createdAt` is
        epoch milliseconds rather than an ISO string.
      properties:
        id: { type: string }
        conversation: { type: string }
        sender: { type: string }
        text: { type: string }
        createdAt:
          type: integer
          description: Epoch milliseconds.
          example: 1787385174937

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            code:
              type: string
              enum: [NO_TOKEN, VALIDATION_ERROR, NOT_FOUND, SERVER_ERROR]
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }

x-websocket:
  description: |
    Socket.IO gateway at the **root origin** (not `/api`), authenticated via the
    handshake `auth: { token }` object.

    Only one event is emitted: `message:new` (server to client), carrying a
    `SocketMessageNew` payload. Crucially, the author does **not** receive their
    own message — the broadcast reaches only the other participants — so an
    optimistic bubble requires no de-duplication against an echo.

    The gateway does **not** accept an inbound `message:send` frame; emitting one
    is silently dropped. Sending must go over `POST /messages`, which is what
    triggers the broadcast.

    No membership or presence events are emitted.
  url: https://frontend-task-chatapp.onrender.com
  events:
    message:new:
      direction: server-to-client
      payload:
        $ref: '#/components/schemas/SocketMessageNew'
