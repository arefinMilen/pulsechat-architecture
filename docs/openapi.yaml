openapi: 3.1.0
info:
  title: PulseChat API
  version: 1.0.0
  description: |
    Enterprise Real-Time Chat Application API Specification (REST + WebSocket).
    Serves 1-to-1 direct messaging, multi-user group chat, member/admin authorization, and Socket.io event transport.
servers:
  - url: https://frontend-task-chatapp.onrender.com/api
    description: Live Production API Gateway

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in or Register
      description: Single-step authentication and registration. If the phone number is new, a user profile is created automatically; if existing, the account is authenticated. Returns a JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request parameters (e.g. missing phone or name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Current User Session
      description: Returns current authenticated user record based on Bearer token.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/search:
    get:
      tags:
        - Users
      summary: Search Users Directory
      description: Search registered users by full name or telephone number digits.
      parameters:
        - name: q
          in: query
          required: true
          description: Search term (name string or phone digits)
          schema:
            type: string
          example: "Ada"
      responses:
        '200':
          description: Matching users array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /conversations:
    get:
      tags:
        - Conversations
      summary: List My Conversations
      description: Returns active direct and group conversation threads for authenticated user.
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      tags:
        - Conversations
      summary: Start Direct Conversation
      description: Opens or starts a 1-to-1 conversation with another user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '200':
          description: Direct conversation object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /conversations/{id}/messages:
    get:
      tags:
        - Conversations
      summary: Get Conversation Message History
      description: Returns paginated messages for a conversation thread.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: before
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  /messages:
    post:
      tags:
        - Messages
      summary: Send Message
      description: Transmits a text message to a conversation. Broadcasts to WebSocket channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Transmitted message object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /conversations/group:
    post:
      tags:
        - Groups
      summary: Create Group Conversation
      description: Instantiates a multi-user group chat. Creator becomes initial admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Created group conversation object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /conversations/{id}/participants:
    post:
      tags:
        - Groups
      summary: Add Participants
      description: Adds members to existing group (Group admins only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantsRequest'
      responses:
        '200':
          description: Updated group conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /conversations/{id}/participants/{userId}:
    delete:
      tags:
        - Groups
      summary: Remove Member / Leave Group
      description: Admin removes member, or member removes self to leave group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member successfully removed

  /conversations/{id}/admins:
    post:
      tags:
        - Groups
      summary: Promote Member to Admin
      description: Grants admin privilege to existing group member (Admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      responses:
        '200':
          description: Updated group object

  /conversations/{id}:
    patch:
      tags:
        - Groups
      summary: Rename Group
      description: Updates title of group conversation (Admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGroupRequest'
      responses:
        '200':
          description: Updated conversation title object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string
        createdAt:
          type: string

    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        adminIds:
          type: array
          items:
            type: string
        lastMessage:
          $ref: '#/components/schemas/Message'
          nullable: true
        updatedAt:
          type: string

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        sender:
          $ref: '#/components/schemas/User'
        text:
          type: string
        createdAt:
          type: string
        status:
          type: string
          enum: [sending, sent, failed]
        clientTempId:
          type: string

    LoginRequest:
      type: object
      required: [phone, name]
      properties:
        phone:
          type: string
          example: "+15551234567"
        name:
          type: string
          example: "Ada Lovelace"

    StartConversationRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

    SendMessageRequest:
      type: object
      required: [conversationId, text]
      properties:
        conversationId:
          type: string
        text:
          type: string
        clientTempId:
          type: string

    CreateGroupRequest:
      type: object
      required: [name, participantIds]
      properties:
        name:
          type: string
        participantIds:
          type: array
          items:
            type: string

    AddParticipantsRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string

    PromoteRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

    RenameGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
